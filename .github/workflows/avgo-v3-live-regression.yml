name: AVGO V4 production live regression
# V4.2 replay: KPI interpretation, provenance and transcript retrieval validation.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/avgo-v3-live-regression.yml'

permissions:
  contents: read

jobs:
  avgo-auto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run deterministic tests
        env:
          PYTHONPATH: src
        run: pytest -q
      - name: Build isolated AVGO watchlist and state
        run: |
          cat > /tmp/avgo-watchlist.yaml <<'EOF'
          companies:
            - ticker: AVGO
              name: Broadcom Inc.
              cik: '0001730168'
              ir_index_url: 'https://investors.broadcom.com/financial-information/financial-news-releases'
              ir_additional_urls:
                - 'https://investors.broadcom.com/financial-information/quarterly-results'
                - 'https://investors.broadcom.com/company-information/past-events'
              official_domains: ['investors.broadcom.com', 'broadcom.com']
          earnings_title_patterns:
            - 'form 8-k'
            - 'earnings'
            - 'financial results'
            - 'quarter results'
            - 'transcript'
            - 'presentation'
          EOF
          printf '{"schema_version":1,"documents":{},"events":{},"source_checks":{},"provider_health":{},"analysis_checkpoints":{}}\n' > /tmp/avgo-v3-state.json
      - name: Run Broadcom Q3 FY2026 through automatic production pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          GEMINI_IR_MODEL: ${{ vars.GEMINI_IR_MODEL || 'gemini-3.6-flash' }}
          GEMINI_IR_FALLBACK_MODEL: ${{ vars.GEMINI_IR_FALLBACK_MODEL || 'gemini-3.5-flash' }}
          GEMINI_ANALYSIS_MODEL: ${{ vars.GEMINI_ANALYSIS_MODEL || 'gemini-3.5-flash-lite' }}
          GEMINI_ANALYSIS_FALLBACK_MODEL: ${{ vars.GEMINI_ANALYSIS_FALLBACK_MODEL || 'gemini-flash-lite-latest' }}
          GEMINI_ANALYSIS_TERTIARY_MODEL: ${{ vars.GEMINI_ANALYSIS_TERTIARY_MODEL || 'gemini-3.5-flash' }}
          GEMINI_ANALYSIS_QUATERNARY_MODEL: ${{ vars.GEMINI_ANALYSIS_QUATERNARY_MODEL || 'gemini-3.6-flash' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CAPTURE_PATH: /tmp/avgo-telegram.txt
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          PYTHONPATH: src
        run: |
          set -o pipefail
          : > /tmp/avgo-v3-live.log
          delivered=0
          for attempt in 1 2; do
            echo "AVGO_LIVE_ATTEMPT=$attempt" | tee -a /tmp/avgo-v3-live.log
            set +e
            python -m us_earnings_monitor \
              --watchlist /tmp/avgo-watchlist.yaml \
              --state /tmp/avgo-v3-state.json \
              --at '2026-09-02T20:30:00-04:00' \
              --tickers AVGO 2>&1 | tee -a /tmp/avgo-v3-live.log
            code=${PIPESTATUS[0]}
            set -e
            if grep -q 'Telegram delivery accepted' /tmp/avgo-v3-live.log; then
              delivered=1
              break
            fi
            echo "AVGO attempt exit_code=$code" | tee -a /tmp/avgo-v3-live.log
            sleep 20
          done
          test "$delivered" -eq 1
          test -s /tmp/avgo-telegram.txt
          ! grep -q 'needs_human_review' /tmp/avgo-v3-live.log
          python - <<'PY'
          import json,re
          state=json.load(open('/tmp/avgo-v3-state.json'))
          events=list(state.get('events',{}).values())
          assert events, 'no AVGO event'
          docs=state.get('documents',{})
          kinds=[docs[k].get('document_kind') for k in events[0].get('documents',[]) if k in docs]
          report=open('/tmp/avgo-telegram.txt',encoding='utf-8').read()
          required=['💡 投資結論與邏輯','📊 關鍵數據與財測','🧭 營運動能與法說攻防','⚠️ 風險、反證與待驗證']
          assert all(item in report for item in required), 'V4 four-section structure missing'
          assert not any(old in report for old in ['🔄 本季變化','🧩 跨段資訊整合','📈 關鍵指標','🎙️ 法說 Q&A']), 'legacy fragmented section leaked'
          assert not re.search(r'\[(?:M[1-5].?[ABCD]|Driver|Lever|Catalyst|Risk|Missing|Alternative)\]',report,re.I), 'internal tag leaked'
          print('AVGO_DOCUMENT_KINDS=', kinds)
          print('AVGO_HAS_TRANSCRIPT_OR_QA=', any(k in {'transcript','qa'} for k in kinds))
          print('AVGO_TRANSCRIPT_STATUS=', events[0].get('collection_status',{}).get('transcript_status'))
          print('AVGO_DOCUMENT_COUNT=', len(kinds))
          print('AVGO_REPORT_CHARS=', len(report))
          PY
      - name: Upload AVGO regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avgo-v4-live-regression
          path: |
            /tmp/avgo-v3-live.log
            /tmp/avgo-v3-state.json
            /tmp/avgo-telegram.txt
          if-no-files-found: ignore
          retention-days: 14
