name: Dell E2E updated-main test

on:
  push:
    branches:
      - "test/dell-e2e-updated-main"

permissions:
  contents: read

jobs:
  dell-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Inspect Dell official event RSS
        run: |
          python - <<'PY'
          import requests
          from xml.etree import ElementTree as ET
          url='https://investors.delltechnologies.com/rss/events.xml'
          r=requests.get(url, headers={'User-Agent':'us-earnings-monitor/0.2'}, timeout=(4,7))
          print('status', r.status_code, 'bytes', len(r.content), 'ctype', r.headers.get('content-type'))
          root=ET.fromstring(r.content)
          for item in root.findall('./channel/item'):
              title=(item.findtext('title') or '').strip()
              if 'Fiscal Year 2027 Second Quarter' not in title:
                  continue
              print('=== MATCHED ITEM ===')
              print(ET.tostring(item, encoding='unicode'))
              for child in item:
                  print('FIELD', child.tag, '=>', repr(child.text))
          PY
