name: US earnings monitor

on:
  schedule:
    # America/New_York handles DST natively.
    # After-hours cadence is intentionally dense through 19:35 ET so the
    # SEC-first v1 has enough runtime to reach Telegram before 09:00 JST.
    - cron: "15 2 * * 1-5"
      timezone: "America/New_York"
    - cron: "15 4 * * 1-5"
      timezone: "America/New_York"
    - cron: "15 6 * * 1-5"
      timezone: "America/New_York"
    - cron: "15 8 * * 1-5"
      timezone: "America/New_York"
    - cron: "15 9 * * 1-5"
      timezone: "America/New_York"
    - cron: "15 12 * * 1-5"
      timezone: "America/New_York"
    - cron: "5 16 * * 1-5"
      timezone: "America/New_York"
    - cron: "25 16 * * 1-5"
      timezone: "America/New_York"
    - cron: "50 16 * * 1-5"
      timezone: "America/New_York"
    - cron: "15 17 * * 1-5"
      timezone: "America/New_York"
    - cron: "45 17 * * 1-5"
      timezone: "America/New_York"
    - cron: "15 18 * * 1-5"
      timezone: "America/New_York"
    - cron: "45 18 * * 1-5"
      timezone: "America/New_York"
    - cron: "15 19 * * 1-5"
      timezone: "America/New_York"
    - cron: "35 19 * * 1-5"
      timezone: "America/New_York"
    # Late enrichment pass for IR/transcript v2; this does not delay SEC v1.
    - cron: "30 20 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "SEC/direct discovery only; no LLM, Telegram, or state write"
        required: false
        default: false
        type: boolean
      preview:
        description: "Run live IR research + analysis and print report; no Telegram or state write"
        required: false
        default: false
        type: boolean
      initialize_baseline:
        description: "Record current filings without AI or Telegram; run once before launch"
        required: false
        default: false
        type: boolean
      test_at:
        description: "Optional historical America/New_York ISO time, for an authorized end-to-end test"
        required: false
        default: ""
        type: string
      test_tickers:
        description: "Optional comma-separated watchlist tickers, to scope an authorized manual test"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    concurrency:
      group: us-earnings-monitor
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run monitor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional. If absent, no OpenAI request is made and no OpenAI cost is incurred.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_IR_MODEL: ${{ vars.GEMINI_IR_MODEL || 'gemini-3.6-flash' }}
          GEMINI_IR_FALLBACK_MODEL: ${{ vars.GEMINI_IR_FALLBACK_MODEL || 'gemini-3.5-flash' }}
          GEMINI_ANALYSIS_MODEL: ${{ vars.GEMINI_ANALYSIS_MODEL || 'gemini-3.5-flash-lite' }}
          GEMINI_ANALYSIS_FALLBACK_MODEL: ${{ vars.GEMINI_ANALYSIS_FALLBACK_MODEL || 'gemini-flash-lite-latest' }}
          GEMINI_ANALYSIS_TERTIARY_MODEL: ${{ vars.GEMINI_ANALYSIS_TERTIARY_MODEL || 'gemini-3.5-flash' }}
          GEMINI_ANALYSIS_QUATERNARY_MODEL: ${{ vars.GEMINI_ANALYSIS_QUATERNARY_MODEL || 'gemini-3.6-flash' }}
          OPENAI_IR_MODEL: ${{ vars.OPENAI_IR_MODEL || 'gpt-5.6-luna' }}
          GEMINI_IR_TIMEOUT_SECONDS: ${{ vars.GEMINI_IR_TIMEOUT_SECONDS || '60' }}
          OPENAI_IR_TIMEOUT_SECONDS: ${{ vars.OPENAI_IR_TIMEOUT_SECONDS || '60' }}
          IR_DIRECT_TIMEOUT_SECONDS: ${{ vars.IR_DIRECT_TIMEOUT_SECONDS || '30' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          TEST_AT: ${{ inputs.test_at }}
          TEST_TICKERS: ${{ inputs.test_tickers }}
          PYTHONPATH: src
        run: |
          args=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then args+=(--dry-run); fi
          if [ "${{ inputs.preview }}" = "true" ]; then args+=(--preview); fi
          if [ "${{ inputs.initialize_baseline }}" = "true" ]; then args+=(--baseline); fi
          if [ -n "$TEST_AT" ]; then args+=(--at "$TEST_AT"); fi
          if [ -n "$TEST_TICKERS" ]; then args+=(--tickers "$TEST_TICKERS"); fi

          # Provider 429/503/timeout is intentionally non-fatal in the Python
          # process so completed analysis checkpoints can be persisted. Retry
          # once inside the same runner: the second invocation resumes only the
          # missing stage/chunk instead of re-spending upstream Gemini calls.
          max_attempts=2
          for attempt in $(seq 1 "$max_attempts"); do
            echo "MONITOR_ATTEMPT=$attempt/$max_attempts"
            : > /tmp/us-monitor-attempt.log
            python -m us_earnings_monitor "${args[@]}" 2>&1 | tee /tmp/us-monitor-attempt.log
            if ! grep -q 'analysis_provider_unavailable' /tmp/us-monitor-attempt.log; then
              break
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "Provider unavailable; resuming from persisted checkpoint in the same job."
              sleep 20
            fi
          done
      - name: Persist monitor state
        if: ${{ !inputs.dry_run && !inputs.preview }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "chore: update monitor state"
          git push
