name: Optics delivery - Guangda SiPho module capex v1
on:
  push:
    branches: [codex/optics-delivery-guangda-sipho-module-capex-20261123-v1]
    paths: [.github/workflows/optics-delivery-guangda-sipho-module-capex-20261123-v1.yml]
permissions:
  contents: read
concurrency:
  group: optics-delivery-guangda-sipho-module-capex-20261123-v1
  cancel-in-progress: false
jobs:
  deliver:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - name: Send verified optics report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          token=os.environ.get("TELEGRAM_BOT_TOKEN")
          chat=os.environ.get("TELEGRAM_CHAT_ID")
          if not token or not chat:
              raise SystemExit("Telegram credentials unavailable")
          message="""AI光通訊重大進展｜光大同創把400G／800G矽光模組計畫推進至量化投資案
          
          1) 重大變化／門檻
          光大同創（301387.SZ）11月23日董事會核准向控股子公司增資6,800萬元，推進總投資50,008.50萬元的高速矽光模組基地。相較4月僅設立合資公司的舊進度，本次新增總預算、設備投資、24個月建設期、技術包／海外授權及達產收益測算，足以改變公司未來營收結構與400G／800G競爭位置，達重大產能投資門檻。
          
          2) 已確認事實
          • 事件／董事會日：2026/11/23；公告日：2026/11/23晚間；股東會預定2026/12/9審議。
          • 項目總投資50,008.50萬元；其中設備20,176.50萬元、軟體220萬元、預備費612萬元、鋪底流動資金29,000萬元。建設周期24個月，但公告未把11/23定義為正式開工日。
          • 公司擬以尚未使用超募資金約6,748.76萬元及自有資金合計增資6,800萬元；其餘總投資由公司自行籌措。持股預計由53.57%升至62.64%。
          • 項目擬引入400G／800G矽光模組生產技術包及相關海外市場授權，配置高精度貼片、打線、光學耦合、COB封裝測試等設備。
          • 可研估算達產後年均營收97,921.81萬元；這是項目測算，不是訂單、管理層業績指引或營收承諾。未披露產能片數／模組數、客戶、良率、ASP、訂單或量產日。
          
          3) 供應鏈／競爭位置
          • 光大同創（301387.SZ）：原主業為消費電子防護／功能材料，本案使其成為400G／800G矽光模組新進者，屬直接曝險。
          • 既有高速模組廠商如中際旭創（300308.SZ）、新易盛（300502.SZ）處於潛在競爭面，但本案尚未完成認證與量產，不能視為已取得市占。
          • 技術包、海外授權、設備供應商及客戶均未具名，不推測供應鏈關係。本案是可插拔400G／800G模組產能，不能等同CPO、1.6T或EML／CW雷射供給。
          
          4) 合理推論
          若股東會通過、剩餘資金到位、技術移轉及客戶認證成功，約9.79億元的達產年均營收測算對公司可能形成第二成長曲線，也會增加成熟400G／800G矽光模組供給。影響最快須經24個月建設與後續認證，實際營收通常晚於廠房／設備完成；目前不能把測算直接計入預測。
          
          5) 投資機會與風險
          催化劑包括12/9股東會通過、政府前置審批、設備下單與到廠、技術授權方揭露、首家客戶認證及首批出貨。風險包括目前增資僅6,800萬元、剩餘資金來源未落實；新進者缺品牌與量產履歷；24個月後市場可能轉向1.6T；矽光良率、光學耦合與封裝測試能力不確定；以及價格下滑、產能過剩與海外授權／出口合規風險。
          
          6) 待驗證／追蹤
          追蹤股東會結果、項目批復、實際開工／設備付款、設計產能與良率、技術包來源、具名客戶、認證階段、首批出貨及收入認列。沒有這些證據前，不把可研收益視為實績。
          
          去重：4月設立合資公司是舊事件；本版只報11/23新增的量化投資與執行資金，既有投遞分支未見同事件版本。
          
          官方（巨潮資訊公司公告檢索）：https://www.cninfo.com.cn/new/fulltextSearch?keyWord=301387
          官方（深交所公司公告）：https://www.szse.cn/disclosure/listed/notice/index.html?stock=301387
          公告全文副本：https://www.cfi.net.cn/p20261123001553.html
          獨立補充：https://www.nbd.com.cn/articles/2026-11-23/4656213.html"""
          payload=json.dumps({"chat_id":chat,"text":message,"link_preview_options":{"is_disabled":True}}).encode()
          req=urllib.request.Request("https://api.telegram.org/bot"+token+"/sendMessage",data=payload,headers={"Content-Type":"application/json"})
          try:
              with urllib.request.urlopen(req,timeout=30) as response:
                  result=json.load(response)
          except Exception:
              raise SystemExit("Telegram delivery failed or unknown; do not retry blindly")
          mid=result.get("result",{}).get("message_id")
          if result.get("ok") is not True or type(mid) is not int or mid<=0:
              raise SystemExit("Telegram receipt invalid")
          receipt={"accepted":True,"message_id":mid,"event":"guangda-sipho-module-capex-20261123","version":1}
          with open("telegram-receipt.json","w") as f: json.dump(receipt,f)
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: optics-telegram-receipt
          path: telegram-receipt.json
