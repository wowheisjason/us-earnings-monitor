name: Optics delivery HIWIN Mikro SiPho inspection Q3 20261111 v1
on:
  push:
    branches: [codex/optics-delivery-hiwin-mikro-sipho-inspection-q3-20261111-v1]
    paths: [.github/workflows/optics-delivery-hiwin-mikro-sipho-inspection-q3-20261111-v1.yml]
permissions:
  contents: read
concurrency:
  group: optics-delivery-hiwin-mikro-sipho-inspection-q3-20261111-v1
  cancel-in-progress: false
jobs:
  deliver:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - name: Send verified optics report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          token=os.environ.get('TELEGRAM_BOT_TOKEN')
          chat=os.environ.get('TELEGRAM_CHAT_ID')
          if not token or not chat:
              raise SystemExit('Telegram credentials unavailable')
          message="【AI光通訊重大進展｜大銀微系統矽光子檢測平台量產｜2026/11/11】\n\n1) 重大變化及門檻\n大銀微系統（4576）在11月11日Q3法說確認，矽光子／CPO檢測定位平台已由驗證進入量產，持續出貨並貢獻營收，相關訂單延伸至2027年中。相較公司9月公開資訊僅揭露4月起出貨、7–8月數百台追加訂單及能見度至2027 Q2，本次新增「已量產並持續貢獻營收」、能見度再延伸，以及第二階段擴產時程與2027資本支出。這是實際量產、訂單與擴產證據，達通知門檻。\n\n2) 已確認事實\n• 事件／法說日：2026/11/11。\n• 4月開始供應國內矽光子檢測設備廠；8月取得量產續單。公司法說稱目前訂單已排至2027年中。\n• 平台用於公司所稱CPO製程「Inspection 3」環節，主要執行光學引擎與系統級測試。量產的是精密定位／檢測平台，不是CPO交換器或光引擎本身。\n• 9月公司公開資料已披露7–8月合計出貨數百台、客戶兩度追加；本次法說確認持續出貨與營收貢獻，但未揭露矽光子營收金額、客戶、單價或毛利。\n• 高階定位平台整體訂單能見度約5–6個月、交期約3個月；元件能見度約3個月、交期2–2.5個月。前者不能全數視為矽光子訂單。\n• 微米／奈米級平台第一階段擴產已於2026年6月完成；第二階段預計2027年2月底至3月中完成，第三階段視客戶專案啟動。\n• 2027年資本支出預估新台幣1.2–1.5億元，涵蓋元件自動化／半自動化、精密加工與生產系統，不是全部用於CPO。\n• Q3公司營收12.19億元、毛利率42.4%、稅後淨利2.57億元、EPS 2.14元，均屬全公司實績；前三季EPS 4.06元。不能把全部成長歸因矽光子。\n\n官方法說頁（2026/11/11）：https://www.hiwinmikro.tw/zh/investor/shareholder\n官方財務資料：https://www.hiwinmikro.tw/zh/investor/financial\n公司9月既有出貨揭露：https://csr.hiwinmikro.tw/zh/news/84ccce98-c164-4971-a967-93005158e0fc/ae379951-c47c-4611-a976-45f06565952c\n法說交叉驗證（中央社）：https://www.cna.com.tw/news/afe/202611110282.aspx\n\n3) 供應鏈與競合\n• 大銀微系統：直接受益，供應奈米級定位平台、控制器、驅動器與馬達；不是PIC、雷射、光模組或交換器廠。\n• 直接客戶僅稱國內矽光子檢測設備廠，未具名；不能猜測終端為台積電、NVIDIA或特定hyperscaler。\n• 下游為光引擎／系統測試設備與量產線；與PIC、CW雷射、EML、FAU及封裝測試流程互補。\n• 歐美精密定位平台商及台日光耦合對位方案可能競爭，但沒有轉單或市占證據。\n\n4) 合理推論\n訂單延伸與第二階段擴產提高2027上半年營收可見度；若交期、良率及客戶拉貨維持，平台占比提高可支撐較佳產品組合。因矽光子營收未單列，現階段只能確認量產採用，不能量化其對42.4%毛利率或EPS的貢獻。此事件亦不代表CPO系統已大規模部署，不能外推InP、EML或整條光通訊鏈缺貨。\n\n5) 機會與風險\n機會：由精密運動元件升級為CPO／矽光子測試平台供應商；高自製率有助交期與整合；量產installed base可帶動控制器、驅動器、馬達與服務。\n風險：單一未具名設備客戶集中、CPO／光引擎量產延遲、第三階段擴產未啟動、設備驗收與收入認列波動、競品降價，以及全公司成長被誤歸因矽光子。未查即時估值，不判斷股價是否已反映。\n\n6) 待驗證\n追蹤矽光子營收占比與毛利、平台實際台數／ASP、2027年中訂單是否如期交付、第二階段產能按期開出、客戶由設備廠延伸至更多客戶、Inspection 3良率／節拍，以及終端CPO或光引擎是否真正量產。"
          if len(message)>4096:
              raise SystemExit('Message too long')
          payload=json.dumps({'chat_id':chat,'text':message,'link_preview_options':{'is_disabled':True}},ensure_ascii=False).encode()
          req=urllib.request.Request('https://api.telegram.org/bot'+token+'/sendMessage',data=payload,headers={'Content-Type':'application/json'})
          try:
              with urllib.request.urlopen(req,timeout=30) as response:
                  result=json.load(response)
          except Exception:
              raise SystemExit('Telegram delivery failed or unknown; do not retry blindly')
          mid=result.get('result',{}).get('message_id')
          if result.get('ok') is not True or type(mid) is not int or mid<=0:
              raise SystemExit('Telegram receipt invalid')
          receipt={'accepted':True,'message_id':mid,'event':'hiwin-mikro-sipho-inspection-q3-20261111','version':1}
          with open('telegram-receipt.json','w') as f: json.dump(receipt,f)
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: optics-telegram-receipt
          path: telegram-receipt.json
