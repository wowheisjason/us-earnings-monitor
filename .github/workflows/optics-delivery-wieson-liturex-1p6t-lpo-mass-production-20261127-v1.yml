name: Deliver Wieson Liturex 1.6T LPO report v1
on:
  push:
    branches: [codex/optics-delivery-wieson-liturex-1p6t-lpo-mass-production-20261127-v1]
    paths: [.github/workflows/optics-delivery-wieson-liturex-1p6t-lpo-mass-production-20261127-v1.yml]
permissions:
  contents: read
concurrency:
  group: optics-delivery-wieson-liturex-1p6t-lpo-mass-production-20261127-v1
  cancel-in-progress: false
jobs:
  deliver:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - name: Send verified optics report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          token=os.environ.get("TELEGRAM_BOT_TOKEN")
          chat=os.environ.get("TELEGRAM_CHAT_ID")
          if not token or not chat:
              raise SystemExit("Telegram credentials unavailable")
          message="""AI光通訊重大進展｜驊陞（6272.TW）跨入自有品牌1.6T LPO量產交付｜2026/11/27

1）重大變化與通知理由
驊陞與光為科技共同開發的WIESON品牌400G／800G／1.6T光模組正式商業推出；公司稱符合OCTC規範的1.6T前面板可插拔LPO模組已進入量產交付。這是驊陞由高速銅連接器延伸為「銅＋光」方案商的可核實商業化里程碑，足以改變競爭定位。注意：重大訊息同時明示短期對財務與業務尚無重大影響，本通知不代表近期待認列營收已可量化。

2）已確認事實
事件日／公告日皆為2026/11/27。光為提供光模組設計；驊陞提供SI／EMI、高速電介面與系統整合，雙方共同開發並由驊陞以WIESON品牌銷售。官方產品表將400G／800G／1.6T列為1.5–50公尺、前面板可插拔、線性驅動與DSP-free optical path；1.6T狀態為「mass production & delivery」。這是公司宣稱，尚無客戶端獨立驗證。NPO僅實驗室驗證完成、系統級驗證中；3.2T為已送樣；6.4T與CPO僅評估中。未揭露客戶、訂單金額、出貨量、ASP、產能、良率或營收貢獻。

3）受影響供應鏈
驊陞（6272.TW）：品牌、SI／EMI、高速電介面與系統整合，直接曝險。光為科技（廣州，未上市）：光模組設計與共同研發，直接技術夥伴。公司稱以越南生產及菲律賓／馬來西亞專業代工供應北美；未公開InP／EML／CW雷射、PIC、Driver／TIA、代工與封測供應商，不能推定任何未具名公司受益。現量產產品屬可插拔LPO，不是NPO或CPO。

4）合理推論
若量產交付能轉為具名客戶認證、重複訂單與穩定良率，驊陞可提高單一AI伺服器／交換器系統的供應內容並擴大可服務市場；DSP-free LPO有機會降低功耗與成本。成立條件是主機端相容性、鏈路預算／FEC、BER與熱可靠度通過系統驗證，且量產規模與毛利足以抵銷新產品導入成本。時間軸目前無法量化。

5）潛在機會與風險
直接潛在受益者為驊陞，光為為未上市夥伴。催化劑包括具名客戶認證、出貨與營收占比、重複訂單、實測功耗／BER及NPO系統驗證。主要風險：公司已稱短期影響不重大；規模、良率與毛利未揭露；驊陞對光為設計能力的依賴；LPO互通性與距離限制；既有1.6T供應商競爭；NPO／CPO替代路徑；海外代工品質與產能。未查即時估值，不判斷股價是否已反映。

6）待驗證與追蹤
追蹤客戶／認證、訂單與出貨單位、ASP與毛利、量產地與月產能、良率、光源／PIC／Driver／TIA供應鏈、OCTC合規文件、lane數／波長／功耗／BER，以及NPO、3.2T、6.4T、CPO後續是否由展示／送樣轉為認證與量產。去重：未查到同事件版本既有投遞分支；歷史資料並非完整通知資料庫，故不宣稱全面去重。

官方：
WIESON（2026/11/27）https://www.wieson.com/news-view.php?lang=en&sn=82
公開資訊觀測站：https://mops.twse.com.tw/
公司新聞稿：https://www.prnewswire.com/apac/zh/news-releases/6272-302951639.html
交叉驗證（經濟日報，2026/11/27）：https://money.udn.com/money/story/11799/9905921"""
          payload=json.dumps({"chat_id":chat,"text":message,"link_preview_options":{"is_disabled":True}},ensure_ascii=False).encode("utf-8")
          req=urllib.request.Request("https://api.telegram.org/bot"+token+"/sendMessage",data=payload,headers={"Content-Type":"application/json"})
          try:
              with urllib.request.urlopen(req,timeout=30) as response:
                  result=json.load(response)
          except Exception:
              raise SystemExit("Telegram delivery failed or unknown; do not retry blindly")
          mid=result.get("result",{}).get("message_id")
          if result.get("ok") is not True or type(mid) is not int or mid<=0:
              raise SystemExit("Telegram receipt invalid")
          receipt={"accepted":True,"message_id":mid,"event":"wieson-liturex-1p6t-lpo-mass-production-20261127","version":1}
          with open("telegram-receipt.json","w") as f: json.dump(receipt,f)
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: optics-telegram-receipt-wieson-liturex-1p6t-lpo-v1
          path: telegram-receipt.json
