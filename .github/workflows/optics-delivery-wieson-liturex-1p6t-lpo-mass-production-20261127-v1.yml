name: Deliver Wieson Liturex 1.6T LPO report v1
on:
  push:
    branches: [codex/optics-delivery-wieson-liturex-1p6t-lpo-mass-production-20261127-v1]
    paths: [.github/workflows/optics-delivery-wieson-liturex-1p6t-lpo-mass-production-20261127-v1.yml]
permissions:
  contents: read
concurrency:
  group: optics-delivery-wieson-liturex-1p6t-lpo-mass-production-20261127-v1
  cancel-in-progress: false
jobs:
  deliver:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - name: Send verified optics report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,base64
          token=os.environ.get("TELEGRAM_BOT_TOKEN")
          chat=os.environ.get("TELEGRAM_CHAT_ID")
          if not token or not chat:
              raise SystemExit("Telegram credentials unavailable")
          message=base64.b64decode("").decode("utf-8")
          payload=json.dumps({"chat_id":chat,"text":message,"link_preview_options":{"is_disabled":True}},ensure_ascii=False).encode("utf-8")
          req=urllib.request.Request("https://api.telegram.org/bot"+token+"/sendMessage",data=payload,headers={"Content-Type":"application/json"})
          try:
              with urllib.request.urlopen(req,timeout=30) as response:
                  result=json.load(response)
          except Exception:
              raise SystemExit("Telegram delivery failed or unknown; do not retry blindly")
          mid=result.get("result",{}).get("message_id")
          if result.get("ok") is not True or type(mid) is not int or mid<=0:
              raise SystemExit("Telegram receipt invalid")
          receipt={"accepted":True,"message_id":mid,"event":"wieson-liturex-1p6t-lpo-mass-production-20261127","version":1}
          with open("telegram-receipt.json","w") as f: json.dump(receipt,f)
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: optics-telegram-receipt-wieson-liturex-1p6t-lpo-v1
          path: telegram-receipt.json
