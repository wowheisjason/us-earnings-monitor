name: Provider capability preflight

on:
  workflow_dispatch:
  push:
    branches:
      - feat/gemini-grounded-ir-event-clock
    paths:
      - scripts/provider_preflight.py
      - .github/workflows/provider-health.yml

permissions:
  contents: read

jobs:
  gemini:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - name: Probe Gemini inference and Google Search separately
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_ANALYSIS_MODEL: ${{ vars.GEMINI_ANALYSIS_MODEL || 'gemini-3.5-flash-lite' }}
          GEMINI_IR_MODEL: ${{ vars.GEMINI_IR_MODEL || 'gemini-3.6-flash' }}
        run: python scripts/provider_preflight.py
