name: SNOW V3 live Telegram test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snow-v3-live-test.yml'

permissions:
  contents: read

jobs:
  snow-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run deterministic tests
        env:
          PYTHONPATH: src
        run: pytest -q
      - name: Build official SNOW FY2027 Q2 evidence fixture
        run: |
          cat > /tmp/snow-watchlist.yaml <<'EOF'
          companies:
            - ticker: SNOW
              name: Snowflake
              cik: '0001640147'
              ir_index_url: 'https://investors.snowflake.com/'
              official_domains: ['investors.snowflake.com', 'snowflake.com', 's26.q4cdn.com']
          earnings_title_patterns:
            - 'form 8-k'
            - 'earnings'
            - 'financial results'
            - 'investor presentation'
            - 'transcript'
          EOF
          cat > /tmp/snow-fixture.json <<'EOF'
          [
            {
              "source": "sec_edgar",
              "source_id": "0001640147-26-000033-ex991",
              "ticker": "SNOW",
              "title": "Snowflake Reports Financial Results for the Second Quarter of Fiscal 2027",
              "published_at": "2026-09-02T16:08:29-04:00",
              "url": "https://www.sec.gov/Archives/edgar/data/1640147/000164014726000033/0001640147-26-000033-index.html",
              "document_url": "https://www.sec.gov/Archives/edgar/data/1640147/000164014726000033/fy2027q2earnings.htm",
              "fiscal_year": 2027,
              "quarter": "Q2",
              "period_end": "2026-07-31",
              "document_kind": "earnings_release",
              "metadata": {"format": "html", "test_provenance": "official_sec"}
            },
            {
              "source": "official_ir",
              "source_id": "snow-q2-fy2027-investor-presentation",
              "ticker": "SNOW",
              "title": "Q2 FY2027 Investor Presentation",
              "published_at": "2026-09-02T17:00:00-04:00",
              "url": "https://s26.q4cdn.com/463892824/files/content_files/Q2-FY2027-Investor-Presentation_vFF.pdf",
              "document_url": "https://s26.q4cdn.com/463892824/files/content_files/Q2-FY2027-Investor-Presentation_vFF.pdf",
              "fiscal_year": 2027,
              "quarter": "Q2",
              "period_end": "2026-07-31",
              "document_kind": "presentation",
              "metadata": {"format": "pdf", "test_provenance": "official_ir"}
            },
            {
              "source": "official_ir",
              "source_id": "snow-q2-fy2027-corrected-transcript",
              "ticker": "SNOW",
              "title": "Q2 FY2027 Earnings Call Corrected Transcript",
              "published_at": "2026-09-02T19:30:00-04:00",
              "url": "https://s26.q4cdn.com/463892824/files/doc_financials/2027/q2/CORRECTED-TRANSCRIPT_-Snowflake-Inc-SNOW-US-Q2-2027-Earnings-Call-2-September-2026-5_00-PM-ET.pdf",
              "document_url": "https://s26.q4cdn.com/463892824/files/doc_financials/2027/q2/CORRECTED-TRANSCRIPT_-Snowflake-Inc-SNOW-US-Q2-2027-Earnings-Call-2-September-2026-5_00-PM-ET.pdf",
              "fiscal_year": 2027,
              "quarter": "Q2",
              "period_end": "2026-07-31",
              "document_kind": "transcript",
              "metadata": {"format": "pdf", "test_provenance": "official_ir"}
            }
          ]
          EOF
          printf '{"schema_version":1,"documents":{},"events":{},"source_checks":{},"provider_health":{}}\n' > /tmp/snow-v3-state.json
      - name: Seed collection-complete state from official evidence
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from us_earnings_monitor.__main__ import ingest, load_fixture, _event_documents
          from us_earnings_monitor.config import load_watchlist
          from us_earnings_monitor.quality import update_collection_status
          from us_earnings_monitor.state import StateStore

          now = datetime.fromisoformat('2026-09-02T20:30:00-04:00').astimezone(ZoneInfo('America/New_York'))
          _, patterns = load_watchlist('/tmp/snow-watchlist.yaml')
          store = StateStore('/tmp/snow-v3-state.json')
          events, ignored = ingest(load_fixture('/tmp/snow-fixture.json'), store, patterns, now)
          assert ignored == 0 and len(events) == 1, (ignored, [e.event_id for e in events])
          event = events[0]
          docs = _event_documents(event, store)
          update_collection_status(event, docs, now, official_ir_checked=True)
          assert event.collection_status.get('transcript_status') == 'FOUND', event.collection_status
          store.put_event(event)
          store.save()
          print('SEEDED_EVENT', event.event_id, event.collection_status)
          PY
      - name: Run SNOW FY2027 Q2 through production V3 and send Telegram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_ANALYSIS_MODEL: ${{ vars.GEMINI_ANALYSIS_MODEL || 'gemini-3.5-flash-lite' }}
          GEMINI_ANALYSIS_FALLBACK_MODEL: ${{ vars.GEMINI_ANALYSIS_FALLBACK_MODEL || 'gemini-flash-lite-latest' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          PYTHONPATH: src
        run: |
          set -o pipefail
          python -m us_earnings_monitor \
            --watchlist /tmp/snow-watchlist.yaml \
            --fixture /tmp/snow-fixture.json \
            --state /tmp/snow-v3-state.json \
            --at '2026-09-02T20:30:00-04:00' \
            --tickers SNOW 2>&1 | tee /tmp/snow-v3-live.log
          grep -q 'Telegram delivery accepted' /tmp/snow-v3-live.log
          ! grep -q 'needs_human_review' /tmp/snow-v3-live.log
      - name: Upload live-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snow-v3-live-test-log
          path: /tmp/snow-v3-live.log
          if-no-files-found: ignore
          retention-days: 7
