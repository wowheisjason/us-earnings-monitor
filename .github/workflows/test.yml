name: US earnings monitor tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run tests
        env:
          PYTHONPATH: src
        run: pytest -q

  dell-search-probe:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/gemini-grounded-ir-event-clock' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Probe Dell official IR with 2.5 Flash-Lite Search
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json
          from us_earnings_monitor.gemini import GeminiClient
          client = GeminiClient(model="gemini-2.5-flash-lite")
          result = client._json('''Return JSON only. Use Google Search to find Dell Technologies Fiscal Year 2027 Second Quarter official investor-relations materials. Return ONLY URLs on investors.delltechnologies.com. Find the exact earnings event page, press release/financial tables/performance review if available, and official transcript. Schema: {"event_urls":[string],"asset_urls":[string],"titles":[string]}.''', 'dell_search_probe', tools=[{"google_search": {}}])
          print("SEARCH_PROBE_BEGIN")
          print(json.dumps(result, ensure_ascii=False, indent=2))
          print("SEARCH_PROBE_END")
          PY
