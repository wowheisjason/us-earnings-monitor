name: US earnings monitor tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run tests
        env:
          PYTHONPATH: src
        run: pytest -q

  dell-capability-probe:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/gemini-grounded-ir-event-clock' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Probe available models and known Dell transcript URL
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json
          from us_earnings_monitor.gemini import GeminiClient
          catalog_client = GeminiClient()
          print("MODEL_CATALOG_BEGIN")
          print(json.dumps(catalog_client._available_models(), ensure_ascii=False, indent=2))
          print("MODEL_CATALOG_END")
          client = GeminiClient(model="gemini-3.5-flash-lite")
          result = client._json('''Return JSON only. Use URL Context to read this official Dell Technologies transcript URL:\nhttps://investors.delltechnologies.com/static-files/a24f97e4-63b2-460d-a4be-44738826e8ce\nConfirm whether it is Dell Technologies Fiscal Year 2027 Second Quarter Results transcript and extract: the earnings-call Q&A speaker names plus two material Q&A topics. Schema: {"is_target_transcript":boolean,"speakers":[string],"qa_topics":[string]}.''', 'dell_transcript_url_probe', tools=[{"url_context": {}}])
          print("TRANSCRIPT_URL_CONTEXT_BEGIN")
          print(json.dumps(result, ensure_ascii=False, indent=2))
          print("TRANSCRIPT_URL_CONTEXT_END")
          PY
