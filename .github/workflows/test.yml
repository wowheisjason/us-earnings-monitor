name: US earnings monitor tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run tests
        env:
          PYTHONPATH: src
        run: pytest -q

  paid-tier-dell-e2e:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/gemini-grounded-ir-event-clock' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Clean-state Dell E2E with Gemini 3.6 Interactions Search
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IR_MODEL: gemini-3.6-flash
          GEMINI_IR_FALLBACK_MODEL: gemini-3.5-flash
          GEMINI_ANALYSIS_MODEL: gemini-3.5-flash-lite
          GEMINI_ANALYSIS_FALLBACK_MODEL: gemini-flash-lite-latest
          GEMINI_IR_TIMEOUT_SECONDS: "60"
          GEMINI_IR_ATTEMPTS: "1"
          IR_DIRECT_TIMEOUT_SECONDS: "5"
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          PYTHONPATH: src
        run: |
          set -o pipefail
          printf '{"schema_version":1,"documents":{},"events":{},"source_checks":{}}\n' > /tmp/e2e-state.json
          python -m us_earnings_monitor --state /tmp/e2e-state.json --preview --at "2026-09-02T20:30:00-04:00" --tickers DELL 2>&1 | tee e2e.log
          grep -q "PREVIEW_REPORT_BEGIN" e2e.log
          ! grep -q "億美元\|兆美元\|億美金\|兆美金" e2e.log
          ! grep -q "needs_human_review" e2e.log
