name: US earnings monitor tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run deterministic tests
        env:
          PYTHONPATH: src
        run: pytest -q
      - name: Offline market monitor smoke test (no API keys, no Telegram)
        env:
          PYTHONPATH: src
        run: >-
          python -m us_earnings_monitor
          --fixture fixtures/disclosures.json
          --dry-run
          --at 2026-08-04T20:00:00-04:00
          --tickers SPCX
          --state /tmp/us-market-smoke-state.json
